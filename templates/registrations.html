<!DOCTYPE html>
<html>
<head><title>Registrations</title></head>
<body>
  <h1>Registered Students</h1>
  <table border="1" cellpadding="6">
    <tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th></tr>
    {% for r in rows %}
    <tr><td>{{ r.id }}</td><td>{{ r.student_name }}</td><td>{{ r.email }}</td>
        <td>{{ r.course_code }} - {{ titles[r.course_code] }}</td></tr>
    {% endfor %}
  </table>
  <p><a href="{{ url_for('register') }}">Register another</a></p>
</body>
</html>
