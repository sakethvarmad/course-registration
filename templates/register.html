<!DOCTYPE html>
<html>
<head><title>Course Registration</title></head>
<body>
  <h1>Online Course Registration</h1>
  <ul style="color:red">
    {% for e in errors %}<li>{{ e }}</li>{% endfor %}
  </ul>
  <form method="POST">
    Name: <input type="text" name="name"><br><br>
    Email: <input type="text" name="email"><br><br>
    Course:
    <select name="course">
      <option value="">-- Select --</option>
      {% for code, title in courses %}
      <option value="{{ code }}">{{ code }} - {{ title }}</option>
      {% endfor %}
    </select><br><br>
    <button type="submit">Register</button>
  </form>
  <p><a href="{{ url_for('registrations') }}">View all registrations</a></p>
</body>
</html>
